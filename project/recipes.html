<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes | The Recipe Book</title>
  <meta name="description" content="Browse the full collection of comfort food and easy, homestyle recipes. Filter by category and view full details.">
  <meta name="author" content="Kaylee Godfrey">

  <meta property="og:title" content="Recipes | The Recipe Book">
  <meta property="og:description" content="Browse the full collection of comfort food and homestyle recipes, filter by category, and view full details.">
  <meta property="og:image" content="https://kayrand.github.io/wdd231/project/images/hero.jpg">
  <meta property="og:url" content="https://kayrand.github.io/wdd231/project/recipes.html">

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/larger.css">

  <script type="module" src="scripts/recipes.js"></script>
</head>
<body>
  <header class="top-bar">
    <div class="header-title">
      <img src="images/logo.svg" alt="The Recipe Book logo" class="logo">
      <span>The Recipe Book</span>
    </div>

    <button id="menu-toggle" aria-label="Open menu">&#9776;</button>

    <nav id="nav-menu">
      <a href="index.html">Home</a>
      <a href="recipes.html" class="active">Recipes</a>
      <a href="submit.html">Share a Recipe</a>
    </nav>

    <a href="submit.html" class="nav-button">Share a Recipe</a>
  </header>

  <main>
    <section class="recipes-header">
      <h1>Our Recipes</h1>
      <p>Browse the collection and click any recipe to see the full details.</p>

      <div class="filter-controls">
        <label for="category-filter">Filter by category:</label>
        <select id="category-filter">
          <option value="all">All Recipes</option>
          <option value="Lunch/Dinner">Lunch/Dinner</option>
          <option value="Soup">Soup</option>
          <option value="Breakfast">Breakfast</option>
          <option value="Dessert">Dessert</option>
          <option value="my-recipes">My Recipes</option>
        </select>
      </div>
    </section>

    <section class="recipes-collection">
      <div id="recipe-cards" class="recipe-grid"></div>
    </section>
  </main>

  <dialog id="recipe-modal">
    <button id="close-modal" aria-label="Close">&times;</button>
    <div id="modal-content"></div>
  </dialog>

  <footer>
    <div class="footer-inner">
      <div class="footer-info">
        <p class="footer-name">The Recipe Book</p>
        <p>Comfort food, made simple.</p>
        <p><a href="attributions.html">Attributions</a></p>
      </div>
      <div class="footer-meta">
        <p>Kaylee Godfrey &middot; WDD 231</p>
        <p>&copy; <span id="year"></span> The Recipe Book</p>
        <p id="lastModified"></p>
      </div>
    </div>
  </footer>
</body>
</html>
